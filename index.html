<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orar INFO-EN · Grupa 152</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f3f4f9; --card:#ffffff; --text:#1c2030; --muted:#6a7186; --line:#dfe3ec;
    --primary:#4f46e5; --danger:#dc2626; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1016; --card:#181b25; --text:#e8eaf2; --muted:#98a0b5; --line:#2a2f3f; --primary:#8b93ff; --danger:#f87171; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .app{ max-width:1560px; margin:0 auto; padding:16px; padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right)); }
  header{ display:flex; flex-wrap:wrap; gap:14px 24px; align-items:center; justify-content:space-between; }
  h1{ margin:0; font-size:1.45rem; letter-spacing:-.01em; }
  .sub{ color:var(--muted); font-size:.85rem; margin-top:2px; }
  .weekbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .weekbar button, .weekbar select{
    height:42px; border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:11px; font:inherit; padding:0 14px; cursor:pointer;
  }
  .weekbar button:hover:not(:disabled){ border-color:var(--primary); }
  .weekbar button:disabled{ opacity:.4; cursor:default; }
  .weekbar select{ font-weight:600; min-width:150px; }
  .weekinfo{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; color:var(--muted); font-size:.9rem; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; background:color-mix(in srgb,var(--primary) 14%,transparent); color:var(--primary); font-size:.78rem; font-weight:600; }
  .pill.muted{ background:color-mix(in srgb,var(--muted) 16%,transparent); color:var(--muted); }
  .linkbtn{ background:none; border:0; color:var(--primary); font:inherit; cursor:pointer; padding:0; text-decoration:underline; }
  .banner{ margin-top:12px; padding:10px 14px; border-radius:12px; background:color-mix(in srgb,#f59e0b 18%,var(--card)); border:1px solid color-mix(in srgb,#f59e0b 50%,transparent); font-size:.88rem; }
  .banner[hidden]{ display:none; }

  .main{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; margin-top:14px; }
  @media (min-width:1480px){ .main{ grid-template-columns:minmax(0,1fr) 290px; align-items:start; } }

  .scroller{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  }
  .grid{
    display:grid; gap:4px; padding:8px; min-width:1010px;
    grid-template-columns:82px repeat(12,minmax(72px,1fr));
    grid-template-rows:auto repeat(6,minmax(88px,auto));
  }
  .hh{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 0 8px; }
  .hh b{ font-size:1.15rem; }
  .hh small{ color:var(--muted); font-size:.68rem; white-space:nowrap; }
  .day{
    position:sticky; left:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px; font-weight:700;
    box-shadow:6px 0 8px -6px rgba(0,0,0,.18);
  }
  .day small{ font-weight:500; color:var(--muted); font-size:.74rem; margin-top:2px; }
  .day.today{ border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 1px var(--primary), 6px 0 8px -6px rgba(0,0,0,.18); }

  .cell{
    border:1.5px dashed var(--line); border-radius:11px; background:transparent; color:var(--muted);
    cursor:pointer; font:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    min-height:88px; padding:0;
  }
  .cell .plus{ font-size:1.4rem; line-height:1; opacity:.45; }
  .cell .gr{ font-size:.66rem; opacity:.6; }
  .cell:hover, .cell:focus-visible{ border-color:var(--primary); color:var(--primary); background:color-mix(in srgb,var(--primary) 8%,transparent); outline:none; }
  .cell:hover .plus{ opacity:1; }

  .item{
    --a:#6366f1;
    z-index:1; text-align:left; font:inherit; color:var(--text); cursor:pointer;
    border:0; border-left:5px solid var(--a); border-radius:11px;
    background:color-mix(in srgb,var(--a) 17%,var(--card));
    padding:8px 10px; display:flex; flex-direction:column; gap:1px; overflow:hidden; min-width:0;
    transition:transform .08s, box-shadow .12s;
  }
  .item:hover, .item:focus-visible{ box-shadow:0 3px 14px color-mix(in srgb,var(--a) 40%,transparent); transform:translateY(-1px); outline:none; }
  .item .te{ font-size:.76rem; color:var(--muted); }
  .item .su{ font-weight:700; font-size:.9rem; overflow-wrap:anywhere; margin-top:2px; }
  .item .ty{ font-size:.78rem; }
  .item .ro{ margin-top:auto; align-self:flex-end; font-size:.78rem; font-weight:600; color:var(--a); }
  .c-tools{ --a:#0d9488; } .c-alg{ --a:#7c3aed; } .c-calc{ --a:#d97706; }
  .c-ap{ --a:#e11d48; } .c-web{ --a:#0284c7; } .c-csa{ --a:#16a34a; }

  .trash{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; }
  .trash h2{ margin:0 0 2px; font-size:1.05rem; display:flex; align-items:center; gap:8px; }
  .trash .count{ background:var(--danger); color:#fff; border-radius:99px; font-size:.75rem; padding:1px 9px; }
  .trash p{ margin:2px 0 10px; color:var(--muted); font-size:.82rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  @media (min-width:1480px){ .chips{ flex-direction:column; } }
  .chip{
    --a:#6366f1; border-left:5px solid var(--a); border-radius:10px;
    background:color-mix(in srgb,var(--a) 15%,var(--card)); padding:7px 10px; font-size:.82rem; min-width:170px;
  }
  .chip b{ display:block; overflow-wrap:anywhere; }
  .chip span{ color:var(--muted); font-size:.76rem; }
  .empty{ color:var(--muted); font-size:.88rem; padding:8px 0; }

  dialog{
    border:0; padding:0; border-radius:18px; background:var(--card); color:var(--text);
    width:min(440px,calc(100vw - 24px)); box-shadow:0 24px 70px rgba(0,0,0,.4);
  }
  dialog::backdrop{ background:rgba(8,10,18,.55); }
  .dlg{ padding:20px; display:flex; flex-direction:column; gap:12px; max-height:86vh; overflow:auto; }
  .dlg h2{ margin:0; font-size:1.2rem; }
  .dlg .rows{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.92rem; }
  .dlg .rows dt{ color:var(--muted); } .dlg .rows dd{ margin:0; font-weight:600; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .btn{ height:44px; padding:0 18px; border-radius:11px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.grow{ flex:1; }
  .pick{
    --a:#6366f1; display:block; width:100%; text-align:left; font:inherit; color:var(--text); cursor:pointer;
    border:1px solid var(--line); border-left:5px solid var(--a); border-radius:11px;
    background:color-mix(in srgb,var(--a) 12%,var(--card)); padding:9px 12px;
  }
  .pick:hover:not(:disabled){ border-color:var(--a); }
  .pick:disabled{ opacity:.45; cursor:not-allowed; }
  .pick b{ display:block; } .pick span{ font-size:.8rem; color:var(--muted); }
  .picks{ display:flex; flex-direction:column; gap:8px; }

  .toast{
    position:fixed; left:50%; bottom:max(20px,env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#1f2433; color:#fff; padding:11px 18px; border-radius:12px; z-index:50; font-size:.9rem;
    max-width:calc(100vw - 32px); box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .toast[hidden]{ display:none; }
  .hint{ color:var(--muted); font-size:.8rem; margin:8px 2px 0; }
  @media (max-width:640px){
    .app{ padding:12px; } h1{ font-size:1.2rem; }
    .weekbar{ width:100%; } .weekbar select{ flex:1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Orar INFO-EN · Grupa 152</h1>
      <div class="sub">Universitatea din București, Facultatea de Matematică și Informatică</div>
    </div>
    <div class="weekbar">
      <button id="prev" aria-label="Săptămâna anterioară">‹</button>
      <select id="weekSel" aria-label="Alege săptămâna"></select>
      <button id="next" aria-label="Săptămâna următoare">›</button>
    </div>
  </header>

  <div class="weekinfo" id="weekInfo"></div>
  <div class="banner" id="banner" hidden></div>

  <div class="main">
    <div>
      <div class="scroller"><div class="grid" id="grid"></div></div>
      <p class="hint">Apasă pe o oră pentru a o muta în coș (doar din săptămâna afișată). Apasă pe o celulă liberă pentru a adăuga o oră din coș. Pe telefon, glisează tabelul orizontal.</p>
    </div>
    <aside class="trash" id="trash"></aside>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script type="module">
/* ============================================================
   CONFIGURARE FIREBASE
   Firebase Console -> Project settings -> Your apps -> Web app
   Copiază aici valorile (apiKey și appId). projectId e deja setat.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCF30MnCtugdScjORWYgtSYzysrC2HHgsg",
  projectId: "orar-fmi-2da04",
  appId: "1:979438588163:web:4477656757f84279785936"
};
const FIREBASE_VERSION = "10.12.2";
const DOC_PATH = ["orar", "main"];           // colecția "orar", documentul "main"
const CONFIGURED = !FIREBASE_CONFIG.apiKey.startsWith("COMPLETEAZA");

/* ============================================================
   DATE ORAR
   ============================================================ */
const WEEKS = 14;
const START = new Date(2026, 8, 28);          // săptămâna 1 începe luni, 28 septembrie 2026
const H0 = 8, H1 = 19;                         // prima și ultima oră (19 = 19:00-19:50)
const DAYS = ["Luni","Marți","Miercuri","Joi","Vineri"];
const LANES = [1,1,1,2,1];                     // joi are 2 rânduri (semigrupele 1 și 2)
const ROW0  = [0,1,2,3,5];                     // rândul (0-based) pe care începe fiecare zi
const ROWMAP = [];
LANES.forEach((n,d)=>{ for(let l=0;l<n;l++) ROWMAP.push({d,l}); });

// full = ocupă toate rândurile zilei (pe joi: ambele semigrupe)
const ITEMS = [
  {id:"tools-lab", c:"tools", subject:"Tools&TechnInCS",  type:"Lab",          teacher:"Sterian MC", room:"L-402",  d:0, s:10, n:2, full:true},
  {id:"alg-curs",  c:"alg",   subject:"StrAlgebriceInInfo",type:"curs",        teacher:"Stamate D",  room:"S-214",  d:0, s:12, n:2, full:true},
  {id:"tools-curs",c:"tools", subject:"Tools&TechnInCS",  type:"curs",         teacher:"Olaru V",    room:"Amf.703",d:0, s:16, n:2, full:true, weeks:w=>w>=2&&w<=8, note:"inițial doar în săptămânile 2–8"},
  {id:"alg-sem",   c:"alg",   subject:"StrAlgebriceInInfo",type:"seminar",     teacher:"Petcu G",    room:"S.209",  d:1, s:10, n:2, full:true},
  {id:"calc-curs", c:"calc",  subject:"CalcDifer&Integr", type:"curs",         teacher:"Sfetcu R",   room:"S-214",  d:1, s:14, n:3, full:true},
  {id:"ap-curs",   c:"ap",    subject:"AlgorithmProgr",   type:"curs",         teacher:"Ceausescu C / Dumitran M", room:"S-214", d:2, s:10, n:2, full:true},
  {id:"web-curs",  c:"web",   subject:"WebTechniques",    type:"curs",         teacher:"Chirita CE", room:"S-214",  d:2, s:12, n:2, full:true},
  {id:"ap-lab1",   c:"ap",    subject:"AlgorithmProgr",   type:"Lab · Gr 1",   teacher:"Ceausescu C",room:"L.411",  d:3, s:10, n:2, full:false, lane:0},
  {id:"web-lab1",  c:"web",   subject:"WebTechniques",    type:"Lab · Gr 1",   teacher:"Mocanu S",   room:"L-507",  d:3, s:12, n:2, full:false, lane:0},
  {id:"web-lab2",  c:"web",   subject:"WebTechniques",    type:"Lab · Gr 2",   teacher:"Mocanu S",   room:"L-404",  d:3, s:10, n:2, full:false, lane:1},
  {id:"ap-lab2",   c:"ap",    subject:"AlgorithmProgr",   type:"Lab · Gr 2",   teacher:"Ceausescu C",room:"L.411",  d:3, s:12, n:2, full:false, lane:1},
  {id:"ap-sem",    c:"ap",    subject:"AlgorithmProgr",   type:"seminar, SP",  teacher:"Ceausescu C",room:"S.109",  d:3, s:14, n:2, full:true, weeks:w=>w%2===0, note:"inițial doar în săptămânile pare"},
  {id:"calc-sem",  c:"calc",  subject:"CalcDifer&Integr", type:"seminar",      teacher:"Sfetcu R",   room:"S.211",  d:3, s:16, n:2, full:true},
  {id:"csa-sem",   c:"csa",   subject:"CompSystArchit",   type:"sem+Lab",      teacher:"Dogaru M",   room:"L-401",  d:4, s:12, n:2, full:true},
  {id:"csa-curs",  c:"csa",   subject:"CompSystArchit",   type:"curs",         teacher:"Rusu C",     room:"S-415",  d:4, s:14, n:2, full:true},
];
const itemById = Object.fromEntries(ITEMS.map(i=>[i.id,i]));

/* ============================================================
   LOGICĂ
   ============================================================ */
const lanesFor = (item,d,lane) =>
  item.full ? Array.from({length:LANES[d]},(_,i)=>i) : [LANES[d]>1 ? lane : 0];

function canFit(weekInst, item, d, lane, h){
  if (h + item.n > H1 + 1) return false;
  const need = lanesFor(item,d,lane);
  for (const inst of weekInst){
    if (inst.d !== d) continue;
    const it = itemById[inst.itemId]; if (!it) continue;
    if (!lanesFor(it,d,inst.l).some(x=>need.includes(x))) continue;
    if (inst.s < h + item.n && h < inst.s + it.n) return false;
  }
  return true;
}

function defaultWeek(w){
  return ITEMS.filter(i=>!i.weeks || i.weeks(w))
    .map(i=>({uid:`${i.id}@${w}`, itemId:i.id, d:i.d, s:i.s, l:i.lane||0}));
}
function defaultState(){
  const weeks = {};
  for (let w=1; w<=WEEKS; w++) weeks[w] = defaultWeek(w);
  return {weeks, trash:[]};
}
function normalize(data){
  data = data || {};
  data.weeks = data.weeks || {};
  for (let w=1; w<=WEEKS; w++) if (!Array.isArray(data.weeks[w])) data.weeks[w] = defaultWeek(w);
  if (!Array.isArray(data.trash)) data.trash = [];
  return data;
}

/* ============================================================
   STOCARE: Firestore (cloud) sau localStorage (mod demo)
   ============================================================ */
function createLocalStore(){
  const KEY = "orar-fmi-local";
  const load = () => { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return defaultState(); } };
  return {
    mode:"local",
    subscribe(cb){ cb(load()); },
    async mutate(fn){
      const data = load(); const ok = fn(data) !== false;
      if (ok) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }
      return {ok, data};
    }
  };
}

async function createFirebaseStore(){
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const [{initializeApp}, {getFirestore, doc, onSnapshot, runTransaction}] = await Promise.all([
    import(`${base}/firebase-app.js`),
    import(`${base}/firebase-firestore.js`)
  ]);
  const db = getFirestore(initializeApp(FIREBASE_CONFIG));
  const ref = doc(db, ...DOC_PATH);

  const store = {
    mode:"cloud",
    subscribe(cb, onErr){
      onSnapshot(ref, snap => {
        if (snap.exists()) cb(normalize(snap.data()));
        else store.mutate(()=>true).catch(onErr);   // creează documentul la prima rulare
      }, onErr);
    },
    // Tranzacție: citește starea cea mai nouă, aplică modificarea, scrie înapoi.
    // Astfel două persoane care modifică simultan nu își suprascriu munca.
    async mutate(fn){
      let ok = false, out = null;
      await runTransaction(db, async tx => {
        const s = await tx.get(ref);
        const data = s.exists() ? normalize(s.data()) : defaultState();
        ok = fn(data) !== false;
        if (ok || !s.exists()) tx.set(ref, data);
        out = data;
      });
      return {ok, data:out};
    }
  };
  return store;
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const dfmt = new Intl.DateTimeFormat("ro-RO", {day:"numeric", month:"short"});

function rawWeek(){
  const n = new Date();
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor(Math.round((t - START)/86400000)/7) + 1;   // round: ține cont de schimbarea orei
}
const currentWeek = () => Math.min(WEEKS, Math.max(1, rawWeek()));
function dayDate(w, d){ const x = new Date(START); x.setDate(x.getDate() + (w-1)*7 + d); return x; }

let state = defaultState();
let week = currentWeek();
let store = null;

function render(){ renderWeekUI(); renderGrid(); renderTrash(); }

function renderWeekUI(){
  $("weekSel").value = String(week);
  $("prev").disabled = week <= 1;
  $("next").disabled = week >= WEEKS;
  const box = $("weekInfo"); box.replaceChildren();
  box.append(`${dfmt.format(dayDate(week,0))} – ${dfmt.format(dayDate(week,4))}`);
  box.append(el("span","pill muted", week%2===0 ? "săptămână pară" : "săptămână impară"));
  if (rawWeek() === week) box.append(el("span","pill","săptămâna curentă"));
  else {
    const b = el("button","linkbtn","Mergi la săptămâna curentă");
    b.onclick = () => { week = currentWeek(); render(); };
    box.append(b);
  }
}

function renderGrid(){
  const g = $("grid"); g.replaceChildren();
  const wk = state.weeks[week] || [];

  g.append(Object.assign(el("div"), {style:"grid-area:1 / 1"}));
  for (let h=H0; h<=H1; h++){
    const c = el("div","hh"); c.style.gridArea = `1 / ${h-H0+2}`;
    c.append(el("b",null,String(h)), el("small",null,`${h}:00 - ${h}:50`));
    g.append(c);
  }

  const todayIdx = (new Date().getDay()+6)%7;
  DAYS.forEach((name,d)=>{
    const c = el("div","day"+(rawWeek()===week && todayIdx===d ? " today":""));
    c.style.gridRow = `${ROW0[d]+2} / span ${LANES[d]}`; c.style.gridColumn = "1";
    c.append(el("span",null,name), el("small",null,dfmt.format(dayDate(week,d))));
    g.append(c);
  });

  // ocupare
  const occ = ROWMAP.map(()=>Array(H1-H0+1).fill(false));
  wk.forEach(inst=>{
    const it = itemById[inst.itemId]; if (!it) return;
    for (const l of lanesFor(it,inst.d,inst.l))
      for (let h=inst.s; h<inst.s+it.n && h<=H1; h++) occ[ROW0[inst.d]+l][h-H0] = true;
  });

  // celule libere
  ROWMAP.forEach(({d,l},r)=>{
    for (let h=H0; h<=H1; h++){
      if (occ[r][h-H0]) continue;
      const b = el("button","cell"); b.type = "button";
      b.style.gridRow = String(r+2); b.style.gridColumn = String(h-H0+2);
      b.title = `${DAYS[d]} ${h}:00${LANES[d]>1?` · Gr ${l+1}`:""} – adaugă oră`;
      b.append(el("span","plus","+"));
      if (LANES[d]>1) b.append(el("span","gr",`Gr ${l+1}`));
      b.onclick = () => openAdd(d,l,h);
      g.append(b);
    }
  });

  // ore
  wk.forEach(inst=>{
    const it = itemById[inst.itemId]; if (!it) return;
    const full = it.full, lane = LANES[inst.d]>1 && !full ? inst.l : 0;
    const b = el("button","item c-"+it.c); b.type = "button";
    b.style.gridRow = `${ROW0[inst.d]+2+lane} / span ${full?LANES[inst.d]:1}`;
    b.style.gridColumn = `${inst.s-H0+2} / span ${it.n}`;
    b.append(el("div","te",it.teacher), el("div","su",it.subject), el("div","ty",it.type), el("div","ro",it.room));
    b.onclick = () => openItem(inst);
    g.append(b);
  });
}

function renderTrash(){
  const t = $("trash"); t.replaceChildren();
  const h = el("h2",null,"Coș de gunoi ");
  h.append(el("span","count",String(state.trash.length)));
  t.append(h, el("p",null,"Comun tuturor săptămânilor. Ia o oră de aici apăsând pe o celulă liberă din orar."));
  if (!state.trash.length){ t.append(el("div","empty","Coșul este gol.")); return; }
  const list = el("div","chips");
  state.trash.forEach(x=>{
    const it = itemById[x.itemId]; if (!it) return;
    const c = el("div","chip c-"+it.c);
    c.append(el("b",null,`${it.subject} (${it.type})`), el("span",null,`${it.teacher} · ${it.n}h · scos din săpt. ${x.from}`));
    list.append(c);
  });
  t.append(list);
}

/* ---------- dialoguri ---------- */
const dlg = $("dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
function showDialog(...nodes){ $("dlgBody").replaceChildren(...nodes); if (!dlg.open) dlg.showModal(); }
const hourRange = (s,n) => `${s}:00 – ${s+n-1}:50`;

function openItem(inst){
  const it = itemById[inst.itemId];
  const dl = el("dl","rows");
  const row = (k,v)=>{ dl.append(el("dt",null,k), el("dd",null,v)); };
  row("Tip", it.type);
  row("Profesor", it.teacher);
  row("Sală", it.room);
  row("Când", `${DAYS[inst.d]}, ${hourRange(inst.s,it.n)} (${it.n} ore)`);
  row("Săptămâna", String(week));
  if (it.note) row("Program inițial", it.note);

  const rm = el("button","btn danger grow","Mută în coș");
  rm.onclick = () => { dlg.close(); act(data=>{
    const arr = data.weeks[week]||[]; const i = arr.findIndex(x=>x.uid===inst.uid);
    if (i<0) return false;
    const [x] = arr.splice(i,1); data.weeks[week] = arr;
    data.trash.push({uid:x.uid, itemId:x.itemId, from:week});
  }); };
  const cl = el("button","btn","Închide"); cl.onclick = () => dlg.close();
  const acts = el("div","actions"); acts.append(rm, cl);
  const sub = el("div","sub",`Se elimină doar din săptămâna ${week}; celelalte săptămâni rămân neschimbate.`);
  showDialog(el("h2",null,it.subject), dl, sub, acts);
}

function openAdd(d,lane,h){
  const wk = state.weeks[week] || [];
  const where = `${DAYS[d]}, ${h}:00${LANES[d]>1?` · Gr ${lane+1}`:""} · săpt. ${week}`;
  const nodes = [el("h2",null,"Adaugă o oră"), el("div","sub",where)];
  if (!state.trash.length){
    nodes.push(el("div","empty","Coșul este gol. Mută mai întâi o oră în coș din orar."));
  } else {
    const list = el("div","picks");
    state.trash.forEach(x=>{
      const it = itemById[x.itemId]; if (!it) return;
      const fits = canFit(wk,it,d,lane,h);
      const b = el("button",`pick c-${it.c}`); b.type = "button"; b.disabled = !fits;
      b.append(el("b",null,`${it.subject} (${it.type})`),
               el("span",null, fits ? `${it.teacher} · ${it.n} ore (${hourRange(h,it.n)})` : `${it.teacher} · ${it.n} ore – nu încape aici`));
      b.onclick = () => { dlg.close(); act(data=>{
        const ti = data.trash.findIndex(y=>y.uid===x.uid); if (ti<0) return false;
        const arr = data.weeks[week] || (data.weeks[week] = []);
        if (!canFit(arr,it,d,lane,h)) return false;
        data.trash.splice(ti,1);
        arr.push({uid:x.uid, itemId:x.itemId, d, s:h, l:(LANES[d]>1 && !it.full) ? lane : 0});
      }); };
      list.append(b);
    });
    nodes.push(list);
  }
  const cl = el("button","btn","Anulează"); cl.onclick = () => dlg.close();
  const acts = el("div","actions"); acts.append(cl);
  nodes.push(acts);
  showDialog(...nodes);
}

/* ---------- acțiuni + sincronizare ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 4000);
}
async function act(fn){
  try {
    const r = await store.mutate(fn);
    if (!r.ok) toast("Acțiunea nu a mai fost posibilă: orarul a fost modificat între timp.");
    if (r.data) { state = r.data; render(); }
  } catch (e) {
    console.error(e);
    toast("Nu s-a putut salva. Verifică conexiunea și regulile Firestore.");
  }
}
function banner(msg){ const b = $("banner"); b.textContent = msg; b.hidden = !msg; }

function buildWeekSelect(){
  const s = $("weekSel");
  for (let w=1; w<=WEEKS; w++){
    const o = el("option",null,`Săptămâna ${w}`); o.value = String(w); s.append(o);
  }
  s.onchange = () => { week = +s.value; render(); };
  $("prev").onclick = () => { if (week>1){ week--; render(); } };
  $("next").onclick = () => { if (week<WEEKS){ week++; render(); } };
}

async function init(){
  buildWeekSelect();
  render();
  if (CONFIGURED){
    try { store = await createFirebaseStore(); }
    catch (e){ console.error(e); banner("Nu m-am putut conecta la Firebase. Se folosește un mod local: modificările nu sunt partajate."); }
  } else {
    banner("Firebase nu este configurat încă (completează FIREBASE_CONFIG în index.html). Până atunci, modificările se salvează doar local, pe acest dispozitiv.");
  }
  if (!store) store = createLocalStore();
  store.subscribe(data => { state = data; render(); },
                  err => { console.error(err); banner("Eroare de sincronizare cu Firebase. Verifică regulile Firestore și conexiunea."); });
}
init();
</script>
